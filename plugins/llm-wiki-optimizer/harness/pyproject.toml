[project]
name = "llm-wiki-optimizer"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.mypy]
strict = true
packages = ["llm_wiki_optimizer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
